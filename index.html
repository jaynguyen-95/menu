<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="apple-touch-icon" href="img/vegas-white.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Vegas Club Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Gothic+A1:wght@300;500;700&family=Noto+Sans+SC:wght@300;500;700&family=Noto+Sans+JP:wght@300;500;700&display=swap">
<style>
/* Landscape Glass, applied to a menu: one dark warm stage, glass cards in a cover flow,
   the dish artwork as the photo, gold for the one action that matters (order). Dark-only by design. */
:root{
  color-scheme:dark;
  --stage-a:#2a211a; --stage-b:#17110d; --stage-c:#0d0907; --sheet-bg:#1b1511;
  --gold-hi:#f8dd93; --gold-lo:#dcae48; --gold:#f1ca6d; --diamond-red:#ed1c24;
  --on:#fff; --on-2:rgba(255,255,255,.80); --on-3:rgba(255,255,255,.60); --line:rgba(255,255,255,.12);
  --thumb-ink:#4d3d2e; --champagne:#c4b799; --sand:#ddd6cb; --taupe:#9c8570; --espresso:#624f3d;
  --glass:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.07));
  --glass-soft:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  --sh-card:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.16),0 34px 60px -26px rgba(0,0,0,.8);
  --sh-glass:inset 0 1px 0 rgba(255,255,255,.30),inset 0 0 0 1px rgba(255,255,255,.12);
  --sh-thumb:inset 0 1px 0 #fff,0 2px 10px rgba(40,25,10,.2);
  --r-pill:999px; --r-card:30px; --r-art:22px; --r-sheet:32px;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-loc:var(--font);
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[lang="ko"]{--font-loc:"Montserrat","Gothic A1","Apple SD Gothic Neo",sans-serif}
:root[lang="zh"]{--font-loc:"Montserrat","Noto Sans SC","PingFang SC",sans-serif}
:root[lang="ja"]{--font-loc:"Montserrat","Noto Sans JP","Hiragino Sans",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage-b);color:var(--on);font-family:var(--font-loc);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage-a)}
input,textarea,.sel{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--on)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dm{width:calc(var(--h,14px)*.524);height:var(--h,14px);flex:none;display:block}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;background:linear-gradient(175deg,var(--stage-a) 0%,var(--stage-b) 55%,var(--stage-c) 100%);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;transition:background 1.2s ease;will-change:background}
.orb.o1{width:52vmax;height:52vmax;left:-14vmax;top:4vmax;opacity:.6;background:#7a5a36}
.orb.o2{width:44vmax;height:44vmax;right:-12vmax;bottom:-10vmax;opacity:.5;background:#5b2a1e}
.screen{position:absolute;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}

/* ---------- shared controls ---------- */
.gl{background:var(--glass-soft);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh-glass)}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-pill);font-size:15px;font-weight:500;white-space:nowrap;transition:transform .15s var(--ease),background .2s}
.pill:active{transform:scale(.97)}
.pill .i{font-size:20px}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s var(--ease)}
.circ:active{transform:scale(.95)}
.circ .i{font-size:21px}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d0e;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 22px -12px rgba(220,174,72,.7)}
.btn-gold[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);gap:2px}
.seg button{height:36px;min-width:44px;padding:0 12px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--on-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--thumb-ink);box-shadow:var(--sh-thumb)}
.eyebrow{font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--on-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#8fd18f;box-shadow:0 0 0 0 rgba(143,209,143,.6);animation:pulse 2s infinite}
.dot.demo{background:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(241,202,109,.5)}70%{box-shadow:0 0 0 8px rgba(241,202,109,0)}100%{box-shadow:0 0 0 0 rgba(241,202,109,0)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--on-2);font-weight:500}
.inp{height:48px;border-radius:14px;padding:0 16px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:16px;outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
textarea.inp{height:auto;min-height:72px;padding:12px 16px;resize:none}
.inp.err{border-color:#ff8a7a}
.hint{font-size:12.5px;color:var(--on-3);line-height:1.5}
.err-msg{font-size:13px;color:#ffb3a6;min-height:18px}

/* ---------- check-in ---------- */
#checkin{align-items:center;justify-content:center;overflow-y:auto}
.ci-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.ci-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:clamp(24px,6vw,96px);align-items:center;width:min(1040px,100%);padding-block:88px 32px}
.ci-brand{display:flex;flex-direction:column;gap:22px}
.ci-brand img{width:min(300px,70%);height:auto}
.ci-brand h1{font-family:var(--font-loc);font-weight:300;font-size:clamp(30px,4.2vw,50px);line-height:1.12;margin:0;text-wrap:balance}
.ci-brand h1 b{font-weight:700;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.ci-brand p{margin:0;color:var(--on-2);font-size:16px;line-height:1.6;max-width:44ch;font-weight:300}
.ci-card{border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:16px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh-card)}
.ci-display{height:72px;border-radius:20px;background:rgba(0,0,0,.28);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:34px;font-weight:600;letter-spacing:.16em;font-variant-numeric:tabular-nums;text-align:center;width:100%;outline:none}
.ci-display::placeholder{color:rgba(255,255,255,.28);letter-spacing:.06em;font-size:20px;font-weight:400}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:62px;border-radius:20px;font-family:var(--font);font-size:26px;font-weight:500;background:rgba(255,255,255,.07);box-shadow:var(--sh-glass);transition:transform .12s,background .15s}
.keypad button:active{transform:scale(.96);background:rgba(255,255,255,.16)}
.keypad .i{font-size:24px;margin:auto}
.demo-row{display:flex;flex-wrap:wrap;gap:8px}
.demo-row button{height:34px;padding:0 12px;border-radius:var(--r-pill);font-size:13px;color:var(--on-2);background:rgba(255,255,255,.06);box-shadow:var(--sh-glass);display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}

/* ---------- member card (mini) ---------- */
.mc{width:26px;height:41px;border-radius:4px;position:relative;overflow:hidden;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.4);display:inline-block}
.mc::before{content:"";position:absolute;left:-30%;top:50%;width:56%;height:66%;transform:translateY(-50%);background:rgba(255,255,255,.85);-webkit-mask:var(--dm-ring) no-repeat center/contain;mask:var(--dm-ring) no-repeat center/contain}
.mc.lg{width:44px;height:69px;border-radius:5px}
.mc.sm{width:12px;height:19px;border-radius:2px}
.mc.sm::before{display:none}

/* ---------- menu screen ---------- */
#menu{gap:10px}
.hdr{display:flex;align-items:center;gap:10px;padding-top:12px;flex-wrap:wrap;position:relative;z-index:5}
.hdr .logo{height:30px;width:auto;margin-right:4px}
.guest{display:flex;align-items:center;gap:12px;height:58px;padding:0 18px 0 10px;border-radius:var(--r-pill);min-width:0}
.guest .g-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.guest .g-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.guest .g-meta{font-size:12.5px;color:var(--on-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.guest .g-meta b{color:var(--gold-hi);font-weight:700}
.treat-on{background:linear-gradient(180deg,rgba(248,221,147,.28),rgba(220,174,72,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(248,221,147,.45)}
.hdr .spacer{flex:1}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;margin-inline:-2px;position:relative;z-index:4}
.cats::-webkit-scrollbar{display:none}
.cat{height:48px;padding:0 20px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:600;color:var(--on-2);white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .15s}
.cat .i{font-size:20px}
.cat .n{font-size:12px;font-weight:600;color:var(--on-3);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{background:#fff;color:var(--thumb-ink);box-shadow:var(--sh-thumb)}
.cat[aria-pressed="true"] .n{color:var(--taupe)}
.cat.locked{color:var(--on-3);background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cat .tb{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d0e}
.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center}

/* cover flow */
.flow{position:relative;flex:none;min-height:0;perspective:1200px;touch-action:pan-y;cursor:grab}
.flow.dragging{cursor:grabbing}
.card{position:absolute;left:50%;top:50%;width:var(--cw,320px);margin-left:calc(var(--cw,320px)/-2);padding:9px 9px 0;border-radius:var(--r-card);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh-card);transition:transform .8s var(--ease),opacity .6s;transform-style:preserve-3d;will-change:transform}
.flow.dragging .card{transition:none}
.card .veil{position:absolute;inset:0;border-radius:inherit;background:var(--stage-c);opacity:var(--dim,0);pointer-events:none;transition:opacity .6s}
.art{position:relative;aspect-ratio:1/1;border-radius:var(--r-art);overflow:hidden;background:#241b14;max-width:100%}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s,opacity .4s}
.art .sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.16) 46%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.card.front .art .sheen{animation:sweep 4.6s ease-in-out infinite}
@keyframes sweep{0%,30%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.is-out .art img{filter:grayscale(1) brightness(.5)}
.is-out .art{opacity:.62}
.out-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 20px;border-radius:var(--r-pill);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:rgba(13,9,7,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);white-space:nowrap;z-index:2}
.sample-tag,.treat-tag{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;z-index:2}
.sample-tag{background:rgba(13,9,7,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.treat-tag{left:auto;right:12px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d0e}
.qty-badge{position:absolute;bottom:12px;right:12px;min-width:34px;height:34px;padding:0 10px;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d0e;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;z-index:2;box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
/* artwork placeholder for sample items */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(120% 80% at 50% 20%,var(--ph-a,#5a4330),var(--ph-b,#1e1611))}
.ph .i{font-size:clamp(48px,28%,120px);width:38%;height:auto;aspect-ratio:1;stroke-width:1.1;color:var(--gold-hi);opacity:.9}
.ph .ph-sub{font-family:var(--font);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--on-3)}

/* front info */
.c-txt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(var(--fs,20px)*.62) 10px calc(var(--fs,20px)*.75);text-align:center}
.c-nm{height:calc(var(--fs,20px)*1.2*2);display:flex;align-items:center;justify-content:center;font-size:var(--fs,20px);font-weight:700;line-height:1.2;letter-spacing:-.01em;width:100%}
.c-nm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.c-meta{height:32px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--on-2);opacity:0;transform:translateY(8px);transition:opacity .5s .25s,transform .5s .25s;white-space:nowrap;overflow:hidden;max-width:100%}
.card.front .c-meta{opacity:1;transform:none}
.card .c-nm{transition:opacity .5s}
.card:not(.front) .c-nm{opacity:0}
.c-meta .tag{height:30px}
.act-row{flex:none;height:78px;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 9px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:13px;color:var(--on-2)}
.tag .i{font-size:18px;color:var(--gold-hi)}
.tag.spicy .i{color:#ff7b5c}
.tag.icon-only{width:32px;padding:0;justify-content:center}
.act{display:flex;gap:10px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:4px;height:52px;padding:4px;border-radius:var(--r-pill)}
.stepper button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.stepper button .i{font-size:20px}
.stepper output{min-width:38px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--font)}
.add-btn{height:52px;padding:0 26px;font-size:16px}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:150}
.nav-arrow.l{left:0}.nav-arrow.r{right:0}
.counter{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:12px;letter-spacing:.2em;color:var(--on-3);font-variant-numeric:tabular-nums;z-index:3}
.edit-banner{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:center}
.edit-banner span{padding:8px 16px;border-radius:var(--r-pill);background:rgba(237,28,36,.18);box-shadow:inset 0 0 0 1px rgba(255,140,140,.5);font-size:13px;font-weight:600}

/* grid view */
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,44vw),1fr));gap:18px;padding:6px 2px 110px;align-content:start;-webkit-overflow-scrolling:touch}
.gcard{border-radius:26px;padding:8px 8px 12px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh-card);display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.gcard .art{border-radius:19px}
.gcard .g-body{display:flex;flex-direction:column;gap:8px;padding:0 6px;min-width:0}
.gcard .g-nm{font-weight:600;font-size:15.5px;line-height:1.25;height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .g-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gcard .tags{justify-content:flex-start;gap:4px}
.gcard .tag.icon-only{width:28px;height:28px}
.gcard .tag .i{font-size:16px}
.gcard .g-add{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.gcard .g-add .i{font-size:22px}
.gcard.is-out .g-nm{color:var(--on-3)}

/* floating cart */
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:20;height:64px;padding:0 24px 0 20px;border-radius:var(--r-pill);display:flex;align-items:center;gap:12px;font-size:17px}
.fab .i{font-size:24px}
.fab .cnt{min-width:30px;height:30px;padding:0 8px;border-radius:var(--r-pill);background:#2a1d0e;color:var(--gold-hi);display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.fab.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.08)}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,5,3,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(520px,100%);background:var(--sheet-bg);box-shadow:-30px 0 60px -20px rgba(0,0,0,.7),inset 1px 0 0 rgba(255,255,255,.08);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .45s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.show{transform:none}
.dr-hd{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.dr-hd h2{margin:0;font-size:22px;font-weight:700;flex:1}
.dr-body{flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.dr-ft{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec-t{font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--on-3);margin:0 0 -8px}
.box{border-radius:20px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:14px 16px}
.c-line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.c-line:last-child{border-bottom:0}
.c-line .th{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#2a2019;position:relative}
.c-line .th img{width:100%;height:100%;object-fit:cover}
.c-line .th .ph{padding:4px}
.c-line .th .ph .i{width:60%;font-size:24px}
.c-line .nm{font-weight:600;font-size:15px;line-height:1.3}
.c-line .sub{font-size:12.5px;color:var(--on-3);margin-top:2px}
.c-line .note{margin-top:8px;height:38px;font-size:14px;border-radius:10px;padding:0 12px}
.c-line .stepper{height:44px}
.c-line .stepper button{width:36px;height:36px}
.c-line .stepper output{min-width:28px;font-size:16px}
.c-line .warn{color:#ffb3a6;font-size:12.5px;font-weight:600;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 15px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--on-2);background:rgba(255,255,255,.06);box-shadow:var(--sh-glass)}
.chip[aria-pressed="true"]{background:#fff;color:var(--thumb-ink);box-shadow:var(--sh-thumb);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--on-3)}
.kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 10px;color:var(--on-3);text-align:center}
.empty .i{font-size:44px;color:var(--taupe)}
.order-row{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.order-row .top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.order-row .top span:last-child{color:var(--on-3);font-weight:400;font-variant-numeric:tabular-nums}
.order-row .lines{font-size:13px;color:var(--on-2);line-height:1.6}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#a9e2a9}
.status.fail{color:#ffb3a6}

/* detail */
.detail{position:fixed;inset:0;z-index:32;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);background:linear-gradient(175deg,var(--stage-a),var(--stage-c));opacity:0;pointer-events:none;transition:opacity .35s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.detail.show{opacity:1;pointer-events:auto}
.d-img{position:relative;display:flex;align-items:center;justify-content:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));min-height:0}
.d-img .art{width:min(100%,calc(100vh - 80px),860px);height:auto;aspect-ratio:1/1;flex:none;border-radius:26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.9)}
.d-panel{background:var(--sheet-bg);box-shadow:inset 1px 0 0 rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.d-panel .dr-body{gap:18px}
.d-nm{font-size:30px;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.d-desc{font-size:16px;line-height:1.6;color:var(--on-2);font-weight:300;margin:0}
.d-alt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.d-alt dt{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--on-3);padding-top:2px}
.d-alt dd{margin:0;color:var(--on-2)}
.legend-list{display:flex;flex-direction:column;gap:2px}
.legend-list .li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.legend-list .li .i{font-size:24px;color:var(--gold-hi)}
.legend-list .li.spicy .i{color:#ff7b5c}
.profile{display:flex;flex-direction:column;gap:10px}
.pbar{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:10px;font-size:13px;color:var(--on-2)}
.pbar span:last-child{text-align:right}
.pbar .trk{height:4px;border-radius:2px;background:rgba(255,255,255,.18);position:relative}
.pbar .trk i{position:absolute;top:-2px;height:8px;width:22%;border-radius:4px;background:var(--diamond-red);left:calc(var(--v) * 78%)}
.pair{display:flex;gap:10px;flex-wrap:wrap}
.pair .p{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;text-align:center;font-size:12.5px;color:var(--on-2)}
.pair .p .i{font-size:32px;color:var(--gold-hi)}
.d-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));z-index:3}
.d-nav{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:3}

/* centered sheet (treat / settings / legend) */
.sheet{position:fixed;left:50%;top:50%;z-index:33;width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .4s var(--ease),opacity .3s;background:var(--sheet-bg);border-radius:var(--r-sheet);box-shadow:0 40px 90px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column}
.sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.sheet .dr-body{padding-bottom:8px}
.tier-row{display:flex;flex-wrap:wrap;gap:8px}
.tier-row button{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 8px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:var(--sh-glass);font-weight:600;font-size:14px}
.tier-row button .mc{width:20px;height:31px}
.tier-row button[aria-pressed="true"]{background:#fff;color:var(--thumb-ink);box-shadow:var(--sh-thumb)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px}
.switch button{width:56px;height:32px;border-radius:16px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch button[aria-checked="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo))}
.switch button[aria-checked="true"]::after{transform:translateX(24px)}

/* toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;z-index:50;transform:translate(-50%,-140%);display:flex;align-items:center;gap:12px;padding:12px 20px 12px 14px;border-radius:22px;background:rgba(40,30,22,.86);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh-card);font-size:15px;font-weight:500;max-width:calc(100% - 32px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.toast.show{transform:translate(-50%,0)}
.toast .dm{--h:22px}

@media (max-width:1180px){
  .hdr .logo{display:none}
}
@media (max-width:960px){
  #treatBtn span{display:none}
  #treatBtn.treat-on span{display:inline}
}
@media (max-width:860px){
  .ci-wrap{grid-template-columns:1fr;gap:28px;padding-block:80px 24px}
  .ci-brand{align-items:center;text-align:center}
  .ci-brand img{width:200px}
  .detail{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .d-img{padding-top:64px}
  .d-img .art{width:min(560px,100%)}
  .d-panel{min-height:auto}
  .hdr .logo{display:none}
}
@media (max-width:560px){
  .guest .g-name{max-width:12ch}
  .hdr .hide-s{display:none}
  .fab{height:56px;padding:0 18px 0 16px}
  .fab .lbl{display:none}
  .main{padding-bottom:64px}
  .hdr{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

/* ================= API adapter ================= */
const API = {
  live(){ return st.cfg.mode==='live' && st.cfg.baseUrl; },
  async req(path, opt){
    const url = st.cfg.baseUrl.replace(/\/+$/,'') + path;
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 8000);
    try{
      const r = await fetch(url, Object.assign({signal:ctl.signal, headers:{'Content-Type':'application/json','Accept':'application/json', ...(st.cfg.apiKey?{'Authorization':'Bearer '+st.cfg.apiKey}:{})}}, opt||{}));
      if(r.status===404) return null;
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    } finally { clearTimeout(tm); }
  },
  async member(no){
    if(!this.live()){ await wait(250); const m = D.DEMO_MEMBERS[no]; return m ? {memberNo:no, name:m.name, tier:m.tier} : null; }
    const m = await this.req('/members/'+encodeURIComponent(no));
    if(!m) return null;
    return {memberNo: m.memberNo||no, name: m.name||m.fullName||'', tier: String(m.tier||'').toUpperCase().replace('ONESIG','ONE SIG').replace('VSIG','V SIG')};
  },
  async availability(){
    if(!this.live()) return null;
    const r = await this.req('/menu/availability');
    const list = Array.isArray(r) ? r : (r && r.items) || [];
    const out = {}; const prices = {};
    list.forEach(x=>{ if(x && x.id){ out[x.id] = x.available !== false; if(x.price!=null) prices[x.id]=x.price; } });
    return {stock:out, prices};
  },
  async send(order){
    if(!this.live()){ await wait(700); return {orderNo:'VG-'+String(Math.floor(1000+Math.random()*9000)), status:'received'}; }
    const r = await this.req('/orders', {method:'POST', body:JSON.stringify(order)});
    return {orderNo: (r && (r.orderNo||r.id)) || order.clientOrderId, status:(r && r.status)||'received'};
  }
};
const wait = ms => new Promise(r=>setTimeout(r,ms));
let pollTimer = null;
async function syncStock(silent){
  if(!API.live()) return;
  try{
    const r = await API.availability();
    if(r){ st.stock = r.stock; st.prices = r.prices; renderMenu(true); if(cartOpen) renderCart(); }
  }catch(e){ if(!silent) toast(T('apiFail')+' '+T('previewNote'), true); }
}
function startPoll(){
  clearInterval(pollTimer);
  if(API.live()) pollTimer = setInterval(()=>syncStock(true), Math.max(10, +st.cfg.poll||30)*1000);
}

}
function artHTML(it, size){

function tagsHTML(it, withLabels){

  it.tags.forEach(t=>{ if(t==='alcohol' && it.wine) return; h += `<span class="tag${withLabels?'':' icon-only'}" title="${esc(L(TAGS[t]))}">${ic(t)}${withLabels?`<span>${esc(L(TAGS[t]).split(/[,(]/)[0].trim())}</span>`:''}</span>`; });

}
function wineMeta(it){
  const w = it.wine; const tp = {red:'wineRed',white:'wineWhite',sweet:'wineSweet'}[w.type];
  return `${esc(T(tp))} · ${esc(L(COUNTRY[w.country]))}`;

function cartQty(id){ const l = st.cart.find(x=>x.id===id); return l ? l.qty : 0; }
function setQty(id, q){
  const it = ITEM[id];
  let l = st.cart.find(x=>x.id===id);
  if(q>0 && !inStock(id)) { toast(T('soldOut')+': '+L(it.name), true); return; }
  if(!l && q>0){ l = {id, qty:0, note:''}; st.cart.push(l); }
  if(!l) return;
  const prev = l.qty; l.qty = Math.max(0, Math.min(99, q));
  if(l.qty===0) st.cart = st.cart.filter(x=>x!==l);
  if(l.qty>prev){ const f=$('#fab'); f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); if(prev===0) toast(T('added')+' · '+L(it.name)); }

/* ---------- cover flow ---------- */
let dragX = null, dragDx = 0, dragMoved = false;
function curIdx(){ return st.idx[st.cat]||0; }
function layoutFlow(dx){
  const flow = $('#flow'); if(!flow) return;
  // Size from the space .main offers (not the flow's own height), then shrink the flow to the card so card + actions sit centred as one group.
  const main = $('#main'); const cs = getComputedStyle(main);
  const act = $('#info'); const actH = act ? act.offsetHeight : 78;
  const W = flow.clientWidth, H = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - actH;
  // Card height is fixed by design: square art + 2-line name box + one meta row, so every card is the same size.
  const land = W > H*1.1;
  const cw = Math.round(Math.max(200, Math.min(land ? 560 : 680, W*(land ? 0.42 : 0.66), (H - 44 - 31)/1.211)));
  const fs = Math.max(16, Math.min(26, cw*0.056));
  flow.style.setProperty('--cw', cw+'px'); flow.style.setProperty('--fs', fs.toFixed(1)+'px');
  const cardH = 1.211*cw + 31; flow.style.height = Math.max(0, Math.min(H, cardH + 48)) + 'px';
  const cards = flow.querySelectorAll('.card'); const n = cards.length; const ci = curIdx();
  const shift = (dx||0)/ (cw*0.62);
  cards.forEach(c=>{
    const i = +c.dataset.i; const off = i - ci + shift; const a = Math.abs(off); const s = Math.sign(off);
    const x = a<=1 ? off*0.62*cw : s*(0.62*cw + (a-1)*0.30*cw);
    const hidden = a>2.7;
    c.style.transform = `translate3d(${x}px,-50%,${-130*Math.min(a,3)}px) rotateY(${-s*Math.min(a,1)*34}deg) scale(${1-0.05*Math.min(a,3)})`;
    c.style.marginTop = '0';
    c.style.top = '50%';
    c.style.zIndex = String(100 - Math.round(a*10));
    c.style.opacity = hidden?'0':'1';
    c.style.visibility = hidden?'hidden':'visible';
    c.style.setProperty('--dim', Math.min(.72, a*.24).toFixed(2));
    c.classList.toggle('front', Math.round(off)===0 && a<.5);
    if(a<=3){ const img = c.querySelector('img[data-src]'); if(img){ img.src = img.dataset.src; img.removeAttribute('data-src'); } }
  });
  $('#counter').textContent = n ? `${String(ci+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}` : '';
  flow.querySelector('.nav-arrow.l').hidden = ci<=0; flow.querySelector('.nav-arrow.r').hidden = ci>=n-1;
  if(dx==null) renderInfo();
}
function go(i){

function bindFlow(){
  const flow = $('#flow');
  flow.addEventListener('pointerdown', e=>{ if(e.target.closest('.nav-arrow')) return; dragX = e.clientX; dragDx = 0; dragMoved = false; flow.setPointerCapture(e.pointerId); });
  flow.addEventListener('pointermove', e=>{ if(dragX==null) return; dragDx = e.clientX - dragX; if(Math.abs(dragDx)>6){ dragMoved = true; flow.classList.add('dragging'); layoutFlow(dragDx); } });
  const end = e=>{
    if(dragX==null) return; flow.classList.remove('dragging');
    const cw = parseFloat(flow.style.getPropertyValue('--cw'))||300;
    if(dragMoved){ const steps = Math.round(-dragDx/(cw*0.62)); go(curIdx() + (steps || (Math.abs(dragDx)>40 ? -Math.sign(dragDx) : 0))); }
    else {
      const card = document.elementFromPoint(e.clientX, e.clientY)?.closest('.card');
      if(card){ const i = +card.dataset.i; if(i===curIdx()) onCardTap(card.dataset.id); else go(i); }

    dragX = null;
  };
  flow.addEventListener('pointerup', end); flow.addEventListener('pointercancel', ()=>{ dragX=null; flow.classList.remove('dragging'); layoutFlow(); });

/* ambient orbs from the front dish */
const orbCache = {};
function setOrbs(a,b){ $('#orb1').style.background=a; $('#orb2').style.background=b; }
function orbsFrom(it){
  if(!it.img){ const c = CAT_PH[it.cat]; setOrbs(c[0], c[0]); return; }
  if(orbCache[it.id]) return setOrbs(...orbCache[it.id]);
  const im = new Image(); im.decoding='async';
  im.onload = ()=>{ try{
    const cv = document.createElement('canvas'); cv.width=12; cv.height=16; const x = cv.getContext('2d'); x.drawImage(im,0,0,12,16);
    const d = x.getImageData(0,0,12,16).data; const avg=(y0,y1)=>{ let r=0,g=0,b=0,n=0; for(let y=y0;y<y1;y++)for(let xx=0;xx<12;xx++){const k=(y*12+xx)*4;r+=d[k];g+=d[k+1];b+=d[k+2];n++;} return [r/n,g/n,b/n]; };
    const tone = c => { const m = Math.max(...c)||1; const k = Math.min(1, 150/m); return `rgb(${c.map(v=>Math.round(v*k)).join(',')})`; };
    orbCache[it.id] = [tone(avg(0,8)), tone(avg(8,16))]; setOrbs(...orbCache[it.id]);
  }catch(e){} };
  im.src = imgThumb(it);
}

async function sendOrder(){
  const miss = [];
  if(!st.staff.trim()){ miss.push(T('staff')); $('#cStaff').classList.add('err'); }
  if(!st.area){ miss.push(T('location')); }
  if(!st.seat.trim()){ miss.push(T('seat')); $('#cSeat').classList.add('err'); }
  if(miss.length){ $('#cErr').textContent = T('fixForm',{f:miss.join(', ')}); return; }
  if(st.cart.some(l=>!inStock(l.id))){ $('#cErr').textContent = T('hasOut'); return; }
  const area = AREAS.find(a=>a.id===st.area);
  const now = new Date();
  const order = {
    clientOrderId: 'ipad-'+now.getTime().toString(36)+'-'+Math.random().toString(36).slice(2,6),
    createdAt: now.toISOString(), source:'ipad-menu', language: st.lang,
    member: {memberNo: st.member.memberNo, name: st.member.name, tier: st.member.tier},
    treat: st.treat ? {type: st.treat.type, memberNo: st.treat.memberNo||null, name: st.treat.name||null, tier: st.treat.tier, approvedBy: st.treat.approvedBy||null} : null,
    staff: {name: st.staff.trim()},
    location: {area: st.area, areaName: area.en, seat: st.seat.trim()},
    note: st.orderNote.trim(),
    items: st.cart.map(l=>({id:l.id, name:ITEM[l.id].name.en, category:ITEM[l.id].cat, qty:l.qty, note:l.note.trim(), viaTreat: catViaTreat(CAT[ITEM[l.id].cat])}))
  };
  sending = true; renderCart();
  try{
    const r = await API.send(order);
    st.orders.unshift({orderNo:r.orderNo, time: now.toLocaleTimeString(st.lang==='vi'?'vi-VN':st.lang,{hour:'2-digit',minute:'2-digit'}), staff:order.staff.name, where:`${L(area)} · ${order.location.seat}`, treat: st.treat?st.treat.label:'', items: st.cart.map(l=>({qty:l.qty, name:L(ITEM[l.id].name), note:l.note}))});
    const ids = st.cart.map(l=>l.id);
    st.cart = []; st.orderNote = ''; LS.set('area', st.area);
    sending = false; cartTab = 'sent'; renderCart(); renderFab(); ids.forEach(refreshQty);
    toast(T('orderSent',{n:r.orderNo}));
  }catch(e){
    sending = false; renderCart(); $('#cErr').textContent = T('apiFail') + ' ' + T('previewNote');
  }
}

  if(kind==='treat'){
    const d = treatDraft;
    sh.querySelectorAll('[data-ttype]').forEach(b=>b.onclick=()=>{ d.type=b.dataset.ttype; d.err=''; openSheet('treat',true); });
    sh.querySelectorAll('[data-ttier]').forEach(b=>b.onclick=()=>{ d.tier=b.dataset.ttier; d.err=''; openSheet('treat',true); });
    const no = $('#tNo'); if(no) no.oninput = e=>{ d.no = e.target.value.replace(/\D/g,''); e.target.value=d.no; d.host=null; };
    const ap = $('#tAppr'); if(ap) ap.oninput = e=>{ d.approver = e.target.value; };
    const ck = $('#tCheck'); if(ck) ck.onclick = async()=>{
      d.err=''; d.host=null;
      try{ const h = await API.member(d.no.trim()); if(!h){ d.err=T('notFound'); } else if(tIdx(h.tier)<=memberTier()){ d.err=T('treatLower'); d.host=h; } else d.host=h; }
      catch(e){ d.err = T('apiFail'); }
      openSheet('treat',true);
    };
    $('#tApply').onclick = ()=>{
      if(d.type==='member'){
        if(!d.host){ d.err = d.no?T('check')+' →':T('needNo'); return openSheet('treat',true); }
        if(tIdx(d.host.tier)<=memberTier()){ d.err=T('treatLower'); return openSheet('treat',true); }
        st.treat = {type:'member', memberNo:d.host.memberNo, name:d.host.name, tier:d.host.tier, label:`${d.host.name} (${d.host.memberNo})`};
      } else {
        if(!d.tier || !d.approver.trim()){ d.err = T('fixForm',{f:[!d.tier?T('level'):'', !d.approver.trim()?T('approver'):''].filter(Boolean).join(', ')}); return openSheet('treat',true); }
        st.treat = {type:'manager', tier:d.tier, approvedBy:d.approver.trim(), label:d.approver.trim()};
      }
      treatDraft = null; closeSheet(); renderMenu(); toast(T('treatOn',{t:st.treat.tier}));
    };
    const rm = $('#tRemove'); if(rm) rm.onclick = ()=>{
      st.treat=null; treatDraft=null;
      st.cart = st.cart.filter(l=>catAllowed(CAT[ITEM[l.id].cat]));
      closeSheet(); renderMenu(); renderFab();
    };
  }
  if(kind==='settings'){
    let mode = st.cfg.mode;
    sh.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; sh.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
    const read = ()=>({mode, baseUrl:$('#sUrl').value.trim(), apiKey:$('#sKey').value.trim(), poll: Math.max(10, parseInt($('#sPoll').value,10)||30)});
    $('#sEdit').onclick = e=>{ st.stockEdit = !st.stockEdit; e.currentTarget.setAttribute('aria-checked', st.stockEdit); if(st.screen==='menu') renderMain(); };
    $('#sSave').onclick = ()=>{
      const c = read(); if(c.mode==='live' && !c.baseUrl){ $('#sErr').textContent = T('fixForm',{f:T('baseUrl')}); return; }
      st.cfg = c; LS.set('cfg', c); if(API.live()) st.stockEdit=false;
      closeSheet(); renderCheckinMeta(); if(st.screen==='menu'){ renderMenu(); syncStock(); startPoll(); }
    };
    $('#sTest').onclick = async()=>{
      const prev = st.cfg; st.cfg = Object.assign({}, read(), {mode:'live'});
      $('#sErr').style.color=''; $('#sErr').textContent = '…';
      try{ if(!st.cfg.baseUrl) throw 0; await API.req('/menu/availability'); $('#sErr').style.color='#a9e2a9'; $('#sErr').textContent = T('connected'); }
      catch(e){ $('#sErr').textContent = T('apiFail') + ' ' + T('previewNote'); }
      st.cfg = prev;
    };
    $('#sReset').onclick = ()=>{ st.stock = Object.fromEntries(D.DEMO_OUT.map(id=>[id,false])); LS.set('stock', st.stock); if(st.screen==='menu') renderMenu(); toast(T('resetDemo')); };
  }
  if(kind==='end'){ $('#eYes').onclick = ()=>{ closeSheet(); endSession(); }; }
}

/* ================= scrim / global events ================= */
function showScrim(){ const s=$('#scrim'); s.hidden=false; requestAnimationFrame(()=>s.classList.add('show')); }
function hideScrimIfIdle(){ if(cartOpen || sheetKind) return; const s=$('#scrim'); s.classList.remove('show'); setTimeout(()=>{ if(!cartOpen && !sheetKind) s.hidden=true; },300); }
function closeAll(){ if(sheetKind) closeSheet(); if(cartOpen) closeCart(); if(detailId) closeDetail(); }
$('#scrim').addEventListener('click', ()=>{ if(sheetKind) closeSheet(); else if(cartOpen) closeCart(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(sheetKind) closeSheet(); else if(detailId) closeDetail(); else if(cartOpen) closeCart(); }
  if(st.screen==='menu' && !detailId && !cartOpen && !sheetKind && st.view==='flow' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key==='ArrowRight') go(curIdx()+1); if(e.key==='ArrowLeft') go(curIdx()-1);
  }
});
document.addEventListener('click', e=>{
  const t = e.target;
  let b;
  if((b = t.closest('[data-close]'))){ if(b.closest('#sheet')) closeSheet(); else if(b.closest('#cart')) closeCart(); else if(b.closest('#detail')) closeDetail(); return; }
  if((b = t.closest('[data-cat]'))){
    const c = CAT[b.dataset.cat];
    if(!catAllowed(c)){ treatDraft = null; openSheet('treat'); treatDraft.hint = T('unlockHint',{c:L(c.name),t:TIERS[c.minTier]}); if(st.member && memberTier()<c.minTier) treatDraft.tier = TIERS[c.minTier]; openSheet('treat',true); return; }
    st.cat = c.id; renderMenu(); return;
  }
  if((b = t.closest('[data-view]'))){ st.view = b.dataset.view; LS.set('view', st.view); renderMenu(); return; }
  if((b = t.closest('[data-nav]'))){ go(curIdx() + (+b.dataset.nav)); return; }
  if((b = t.closest('[data-add]'))){ if(st.stockEdit){ toggleStock(b.dataset.add); return; } setQty(b.dataset.add, cartQty(b.dataset.add)+1); return; }
  if((b = t.closest('[data-inc]'))){ setQty(b.dataset.inc, cartQty(b.dataset.inc)+1); return; }
  if((b = t.closest('[data-dec]'))){ setQty(b.dataset.dec, cartQty(b.dataset.dec)-1); return; }
  if((b = t.closest('[data-open]'))){ if(st.stockEdit){ toggleStock(b.dataset.open); return; } openDetail(b.dataset.open); return; }
  if((b = t.closest('[data-dnav]'))){ const it = ITEM[detailId]; const list = catItems(it.cat); const i = list.indexOf(it)+(+b.dataset.dnav); if(list[i]){ detailId = list[i].id; if(st.view==='flow'){ st.idx[st.cat]=i; layoutFlow(); } renderDetail(); } return; }
  if((b = t.closest('[data-area]'))){ st.area = b.dataset.area; document.querySelectorAll('[data-area]').forEach(x=>x.setAttribute('aria-pressed', x===b)); return; }
  if((b = t.closest('[data-ctab]'))){ cartTab = b.dataset.ctab; renderCart(); return; }
});
$('#fab').addEventListener('click', openCart);
$('#treatBtn').addEventListener('click', ()=>{ treatDraft=null; openSheet('treat'); });
$('#legendBtn').addEventListener('click', ()=>openSheet('legend'));
$('#settingsBtn').addEventListener('click', ()=>openSheet('settings'));
$('#ciSettings').addEventListener('click', ()=>openSheet('settings'));
$('#endBtn').addEventListener('click', ()=>openSheet('end'));
$('#guestChip').addEventListener('click', openCart);
let rz; const relayout = ()=>{ cancelAnimationFrame(rz); rz = requestAnimationFrame(()=>layoutFlow()); };
window.addEventListener('resize', relayout);
try{ new ResizeObserver(relayout).observe($('#main')); }catch(e){}
try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}

/* ================= boot ================= */
$('#ciSettings').innerHTML = ic('gear');
buildKeypad();
$('#staffInput').value = st.staff;
setLang(st.lang);
})();
</script>

</html>
